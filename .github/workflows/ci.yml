name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # engines.node is >=20; exercise current LTS pair for runtime coverage.
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci
        env:
          HUSKY: '0'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        if: matrix.node-version != 20
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == 20
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size
        if: matrix.node-version == 20
        run: npm run size
