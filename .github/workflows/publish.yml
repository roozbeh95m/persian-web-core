name: Publish

# Manual only — run from Actions → Publish. Use dry_run=false for a live release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: If true, only simulate publish; set false to publish to npm
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci
        env:
          HUSKY: '0'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
