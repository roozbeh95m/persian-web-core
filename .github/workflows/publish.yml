name: Publish

# Manual only — run from Actions → Publish. Use dry_run=false for a live release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: If true, only simulate publish; set false to publish to npm
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 ships a recent enough npm for OIDC; avoid registry-url so
          # setup-node does not write an empty NODE_AUTH_TOKEN into .npmrc.
          node-version: 24
          cache: npm

      # Trusted publishing needs npm CLI >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci
        env:
          HUSKY: '0'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
